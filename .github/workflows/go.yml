name: Go Quality Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: test/distributed-tracing-regression-20261105
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply gofmt on maintenance branch
        if: github.event_name == 'pull_request' && github.head_ref == 'test/distributed-tracing-regression-20261105' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          gofmt -w internal/infra/server/service_a/main.go internal/infra/server/service_a/main_test.go internal/infra/server/service_b/main.go internal/infra/server/service_b/main_test.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal
            git commit -m "style: format tracing test changes"
            git push origin HEAD:test/distributed-tracing-regression-20261105
          fi
      - name: Verify formatting
        run: |
          gofmt -l internal
          test -z "$(gofmt -l internal)"
      - name: Run tests with race detector
        run: go test -race ./...
      - name: Build services
        run: |
          go build ./internal/infra/server/service_a
          go build ./internal/infra/server/service_b
      - name: Vet
        run: go vet ./...

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate Compose configuration
        env:
          WEATHER_API_KEY: ci-dummy-only
        run: docker compose config --quiet
      - name: Build container images
        env:
          WEATHER_API_KEY: ci-dummy-only
        run: docker compose build service_a service_b
