name: Go Quality Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/distributed-tracing-shutdown-20261105
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Format changed Go sources on maintenance branch
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/distributed-tracing-shutdown-20261105' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          gofmt -w internal/provider/provider.go internal/infra/server/service_a/main.go internal/infra/server/service_a/main_test.go internal/infra/server/service_b/main.go internal/infra/server/service_b/main_test.go internal/infra/server/lifecycle/server.go internal/infra/server/lifecycle/server_test.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal
            git commit -m "style: format Go tracing and lifecycle sources"
            git push origin HEAD:feat/distributed-tracing-shutdown-20261105
          fi
      - name: Verify formatting
        run: test -z "$(gofmt -l internal)"
      - name: Run tests with race detector
        run: go test -race ./...
      - name: Build services
        run: |
          go build ./internal/infra/server/service_a
          go build ./internal/infra/server/service_b
      - name: Vet
        run: go vet ./...
      - name: Validate Docker Compose
        env:
          WEATHER_API_KEY: ci-placeholder
        run: docker compose config --quiet
