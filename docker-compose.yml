services:
  zipkin:
    image: openzipkin/zipkin-slim:3.6.1
    ports:
      - "127.0.0.1:9411:9411"
    networks: [telemetry]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.1
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./.docker/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - zipkin
    networks: [telemetry]

  service_b:
    build:
      context: .
      dockerfile: Dockerfile.service_b
    environment:
      HTTP_PORT: ":8181"
      WEATHER_API_KEY: "${WEATHER_API_KEY:?Set WEATHER_API_KEY in a local .env file}"
      OTEL_COLLECTOR_ENDPOINT: "otel-collector:4317"
    depends_on:
      - otel-collector
    networks: [telemetry]

  service_a:
    build:
      context: .
      dockerfile: Dockerfile.service_a
    environment:
      HTTP_PORT: ":8080"
      SERVICE_B_URL: "http://service_b:8181/cep"
      OTEL_COLLECTOR_ENDPOINT: "otel-collector:4317"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - service_b
    networks: [telemetry]

networks:
  telemetry:
