services:
  zipkin:
    image: openzipkin/zipkin:3.6.1
    ports:
      - "127.0.0.1:9411:9411"
    networks: [observability]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./.docker/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      - zipkin
    networks: [observability]

  service_b:
    build:
      context: .
      dockerfile: Dockerfile.service_b
    environment:
      WEATHER_API_KEY: ${WEATHER_API_KEY:?Set WEATHER_API_KEY in your shell or a local .env file}
      OTEL_COLLECTOR_ENDPOINT: otel-collector:4317
    depends_on:
      - otel-collector
    networks: [observability]

  service_a:
    build:
      context: .
      dockerfile: Dockerfile.service_a
    environment:
      OTEL_COLLECTOR_ENDPOINT: otel-collector:4317
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - service_b
    networks: [observability]

networks:
  observability:
